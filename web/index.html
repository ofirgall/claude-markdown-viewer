<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversation Preview</title>
  <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <button id="tocBtn" class="btn" title="Turns (t)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <h1 id="title">Conversation</h1>
    <span id="updated" class="updated"></span>
    <button id="toolsBtn" class="btn btn-text" title="Expand / collapse all tool calls (e)">Tools</button>
    <div id="widthCtl" class="width-ctl">
      <button id="wideBtn" class="btn btn-text" title="Content width: click for 50 / 70 / 95% (w), hover for a slider">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="widthLabel">50%</span>
      </button>
      <div class="width-pop">
        <input id="widthSlider" type="range" min="50" max="100" step="1" value="50" aria-label="Content width">
      </div>
    </div>
    <button id="followBtn" class="btn active" title="Follow new messages (f)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 4v14M6 12l6 6 6-6M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="searchBtn" class="btn" title="Search (/ or Ctrl+F)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="statusDot" class="status-dot" title="Disconnected"></div>
    <button id="themeBtn" class="btn" title="Toggle light/dark">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none"></svg>
    </button>
  </header>

  <div id="loadingSkeleton" class="skeleton">
    <div class="skeleton-line"></div><div class="skeleton-line"></div>
    <div class="skeleton-line"></div><div class="skeleton-line"></div>
    <div class="skeleton-line"></div><div class="skeleton-line"></div>
  </div>

  <nav id="toc" aria-label="Turns"></nav>
  <div id="searchBar" hidden>
    <input id="searchInput" type="search" placeholder="Search…" autocomplete="off">
    <span id="searchCount"></span>
    <button id="searchPrev" class="btn" title="Previous (Shift+Enter)">↑</button>
    <button id="searchNext" class="btn" title="Next (Enter)">↓</button>
    <button id="searchClose" class="btn" title="Close (Esc)">✕</button>
  </div>
  <main id="content" style="display:none"></main>

  <footer id="navBar">
    <div class="nav-group" data-kind="turn">
      <span class="nav-label">Turn</span>
      <button class="btn nav-prev" title="Previous turn (k)">↑</button>
      <span class="nav-pos"></span>
      <button class="btn nav-next" title="Next turn (j)">↓</button>
    </div>
    <div class="nav-group" data-kind="code">
      <span class="nav-label">Code</span>
      <button class="btn nav-prev" title="Previous code block ([)">↑</button>
      <span class="nav-pos"></span>
      <button class="btn nav-next" title="Next code block (])">↓</button>
    </div>
    <div class="nav-group" data-kind="diagram">
      <span class="nav-label">Diagram</span>
      <button class="btn nav-prev" title="Previous diagram ({)">↑</button>
      <span class="nav-pos"></span>
      <button class="btn nav-next" title="Next diagram (})">↓</button>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
